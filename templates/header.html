<header class="py-3 mb-4 container poppins-reg">
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="justify-content collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav justify-content-between w-lg-35 w-md-50 w-sm-100">
                    <li class="nav-item">
                        <a href="{% url 'home' %}" class="text-decoration-none {{text_color}}">О приложении</a>
                    </li>
                    <li class="nav-item"><a href="#" class="text-decoration-none {{text_color}}">Города</a></li>
                    <li class="nav-item"><a href="{% url 'nannies' %}" class="text-decoration-none {{text_color}}">Няням</a></li>
                </ul>
            </div>
            {% if not user.is_authenticated  %}
                <div id="registration-block">
                    <a href="{% url 'account_login' %}" class="text-decoration-none">
                        <button class="registration-white btn py-2 px-5">Войти</button>
                    </a>
                </div>
            {% else %}
                {% load static %}
                <div class="rounded-3 bg-white w-lg-20 w-md-25 w-sm-50 text-center mx-lg-0 mx-md-0 mx-sm-auto py-1 px-3">
                    <img src={% static 'img/fire.svg' %} /> Дней осталось: <strong>{% if end_range is defined %}{{ end_range }}{% endif %}</strong>
                </div>    
            {% endif %}
        </div>
    </nav>
</header>
